function saveProposalStandalone(sid, type, submit){
  const key=proposalKey(sid,type);
  const existing=APP.proposalRecords[key]||{};
  const rec={
    ...existing,
    names:       document.getElementById('pNames')?.value.trim()||'',
    title:       document.getElementById('pTitle')?.value.trim()||'',
    desc:        document.getElementById('pDesc')?.value.trim()||'',
    strandC:     document.getElementById('pC')?.checked||false,
    strandA:     document.getElementById('pA')?.checked||false,
    strandS:     document.getElementById('pS')?.checked||false,
    rationale:   document.getElementById('pRationale')?.value.trim()||'',
    goals:       document.getElementById('pGoals')?.value.trim()||'',
    plan:        document.getElementById('pPlan')?.value.trim()||'',
    risk:        document.getElementById('pRisk')?.value.trim()||'',
    challenges:  document.getElementById('pChallenges')?.value.trim()||'',
    reflectionPlan:document.getElementById('pReflection')?.value.trim()||'',
    demo:        document.getElementById('pDemo')?.value.trim()||'',
    status:      submit?'pending':'draft',
    teacherFeedback: submit?'':existing.teacherFeedback||'',
    submittedAt: submit?new Date().toISOString():existing.submittedAt||'',
    savedAt:     new Date().toISOString(),
    sid, type
  };
  if(!rec.title&&submit){alert('Please enter a title before submitting.');return;}
  APP.proposalRecords[key]=rec;
  saveAll();
  setModal(null);
  showToast(submit?'Proposal submitted for teacher approval.':'Proposal saved as draft.','ok');
  renderStudentHome();
}

function submitProposalForApproval(sid, type){
  const key=proposalKey(sid,type);
  const rec=APP.proposalRecords[key];
  if(!rec||!rec.title){showToast('Please complete the proposal form first.','err');return;}
  rec.status='pending';
  rec.submittedAt=new Date().toISOString();
  saveAll();
  showToast('Proposal submitted for teacher approval.','ok');
  renderStudentHome();
}

// ── Teacher: approve or return proposal ────────────────────────────
function getAllPendingProposals(){
  const result=[];
  Object.entries(APP.proposalRecords).forEach(([key,rec])=>{
    if(rec.status==='pending'){
      const stu=APP.students.find(s=>s.id===rec.sid);
      result.push({key,rec,student:stu});
    }
  });
  return result;
}

function teacherApproveProposal(key){
  const rec=APP.proposalRecords[key];
  if(!rec)return;
  rec.status='approved';
  rec.teacherFeedback='';
  saveAll();

  render();
}

function submitTeacherProposalFeedback(key){

// ── Proposal form (attached to an existing experience — delegates to standalone) ──
function openProposalForm(sid, expId){
  // For experiences attached to a proposal type, use the standalone proposal form
  // which is keyed by student+type and gates the experience slot
  const exp=expId?(APP.experiences[sid]||[]).find(e=>e.id===expId):null;
  const type=exp?exp.type:(APP._defaultExpType||'project');
  openProposalFormStandalone(sid, type);
}

function saveProposal(sid, expId){
  const proposal={
    names:       document.getElementById('pNames')?.value.trim()||'',
    title:       document.getElementById('pTitle')?.value.trim()||'',
    desc:        document.getElementById('pDesc')?.value.trim()||'',
    strandC:     document.getElementById('pC')?.checked||false,
    strandA:     document.getElementById('pA')?.checked||false,
    strandS:     document.getElementById('pS')?.checked||false,
    rationale:   document.getElementById('pRationale')?.value.trim()||'',
    goals:       document.getElementById('pGoals')?.value.trim()||'',
    plan:        document.getElementById('pPlan')?.value.trim()||'',
    risk:        document.getElementById('pRisk')?.value.trim()||'',
    challenges:  document.getElementById('pChallenges')?.value.trim()||'',
    reflectionPlan:document.getElementById('pReflection')?.value.trim()||'',
    demo:        document.getElementById('pDemo')?.value.trim()||'',
    savedAt:     new Date().toISOString(),
  };

  if(expId){
    const exp=(APP.experiences[sid]||[]).find(e=>e.id===expId);
    if(exp){
      exp.proposal=proposal;
      // Sync name from proposal title if not set
      if(proposal.title&&!exp.name)exp.name=proposal.title;
    }
  }
  saveAll();
  setModal(null);
  showToast('Proposal saved.','ok');
  // Re-render wherever we are
  if(APP.role==='student')renderStudentHome();
  else render();
  if(configured()&&expId){
    const exp=(APP.experiences[sid]||[]).find(e=>e.id===expId);
    if(exp)apiCall('saveExperience',{exp}).catch(()=>{});
  }
}

//  GEMINI AI ASSISTANT
// ══════════════════════════════════════════════════
const GEM_SYSTEM_PROMPT=`You are a helpful assistant for IB CAS (Creativity, Activity, Service) students following the 2017 syllabus. You help students understand and engage with CAS requirements.

Key facts:
- There are 7 Learning Outcomes (LOs): LO1 Strengths & Growth, LO2 Challenges & Skills, LO3 Initiative & Planning, LO4 Commitment & Perseverance, LO5 Collaboration, LO6 Global Significance, LO7 Ethics & Choices
- Experience types: Single Experience (one-off, covers LO1+LO2), Short Experience (8 weeks, covers LO1–LO5), Extended Experience (6 months, covers all 7 LOs), CAS Project (collaborative, covers all 7 LOs)
- Students must cover all 7 LOs across their experiences, with approved experiences confirmed by their supervisor
- Evidence can be photos, videos, emails, certificates, session plans, or other documents
- Reflections should answer: what did I do, what did I learn/how did I grow, how does this connect to the LO?

Be encouraging, concise and practical. Help students think through their activities and reflections. Do not write reflections for them — guide them to write their own. Keep responses under 200 words unless more detail is genuinely needed.`;

function gemConfigured(){return GEMINI_API_KEY&&GEMINI_API_KEY!=='YOUR_GEMINI_API_KEY_HERE'}

function toggleGem(){
  APP.gemOpen=!APP.gemOpen;
  document.getElementById('gemPanel').classList.toggle('hidden',!APP.gemOpen);
  if(APP.gemOpen) setTimeout(()=>document.getElementById('gemInput')?.focus(),150);
}

function gemQuick(text){
  document.getElementById('gemChips').style.display='none';
  document.getElementById('gemInput').value=text;
  sendGemMessage();
}

function appendGemMsg(role,text,typing=false){
  const el=document.getElementById('gemMessages');
  if(!el)return;
  const div=document.createElement('div');
  div.className=`gem-msg ${role}${typing?' typing':''}`;
  div.id=typing?'gemTyping':'';
  // Render basic markdown: **bold**, *italic*, bullet lines
  div.innerHTML=text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^[-•] (.+)$/gm,'<div style="padding-left:10px">• $1</div>')
    .replace(/\n/g,'<br>');
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
  return div;
}

async function sendGemMessage(){
  const input=document.getElementById('gemInput');
  const btn=document.getElementById('gemSendBtn');
  const text=(input?.value||'').trim();
  if(!text)return;

  if(!gemConfigured()){
    appendGemMsg('ai','⚠️ Gemini API key not configured yet. Add your key to the GEMINI_API_KEY constant in this file. Get a free key at **aistudio.google.com**.');
    return;
  }

  input.value='';
  input.style.height='auto';
  if(btn)btn.disabled=true;
  appendGemMsg('user',text);

  // Add to history
  APP.gemHistory.push({role:'user',parts:[{text}]});

  // Typing indicator
  const typingEl=appendGemMsg('ai','Thinking…',true);

  try{
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          system_instruction:{parts:[{text:GEM_SYSTEM_PROMPT}]},
          contents:APP.gemHistory,
          generationConfig:{maxOutputTokens:400,temperature:0.7}
        })
      }
    );
    const data=await res.json();
    if(typingEl)typingEl.remove();

    if(data.error){
      appendGemMsg('ai',`⚠️ API error: ${data.error.message}`);
    } else {
      const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||'Sorry, I could not generate a response.';
      APP.gemHistory.push({role:'model',parts:[{text:reply}]});
      appendGemMsg('ai',reply);
    }
  }catch(err){
    if(typingEl)typingEl.remove();
    appendGemMsg('ai','⚠️ Could not reach Gemini. Check your internet connection and API key.');
  }

  if(btn)btn.disabled=false;
  input?.focus();
}

function showGemFab(show){
  const fab=document.getElementById('gemFab');
  if(fab)fab.style.display=show?'flex':'none';
  if(!show){
    APP.gemOpen=false;
    const panel=document.getElementById('gemPanel');
    if(panel)panel.classList.add('hidden');
  }
}

function getRecordings(sid){return APP.reviewRecordings[sid]||[]}

function addRecording(sid){
  const url=prompt('Paste the URL to the recording (Google Drive, Teams, etc.):','');
  if(!url||!url.trim())return;
  const label=prompt('Label for this recording (e.g. "Term 1 Review — Nov 2024"):','Review meeting recording');
  if(!APP.reviewRecordings[sid])APP.reviewRecordings[sid]=[];
  APP.reviewRecordings[sid].push({url:url.trim(),label:label||'Recording',addedAt:new Date().toISOString()});
  saveAll();
  // Re-render
  if(APP.role==='student')renderStudentHome();
  else render();
}

function deleteRecording(sid,idx){
  if(!confirm('Remove this recording link?'))return;
  if(APP.reviewRecordings[sid])APP.reviewRecordings[sid].splice(idx,1);
  saveAll();
  if(APP.role==='student')renderStudentHome();
  else render();
}

function renderRecordings(sid,editable=true){
  const recs=getRecordings(sid);
  if(!recs.length&&!editable)return'';
  return`<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--bdr)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <div style="font-size:13px;font-weight:600;color:var(--tx2)">🎙 Review meeting recordings</div>
      ${editable?`<button class="btn btn-xs btn-p" onclick="addRecording('${sid}')">+ Add recording link</button>`:''}
    </div>
    ${recs.length?`<div style="display:flex;flex-direction:column;gap:7px">
      ${recs.map((r,i)=>`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <a href="${esc(r.url)}" target="_blank" rel="noopener" class="rec-link">
          <span style="font-size:16px">▶</span>
          <span class="rec-badge">REC</span>
          ${esc(r.label)}
          ${r.addedAt?`<span style="font-weight:400;opacity:.7;font-size:11px">· ${new Date(r.addedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</span>`:''}
        </a>
        ${editable?`<button class="btn btn-xs btn-danger" onclick="deleteRecording('${sid}',${i})">Remove</button>`:''}
      </div>`).join('')}
    </div>`:`<div style="font-size:13px;color:var(--tx3)">No recordings added yet. Paste a link to a Google Drive or Teams recording after your review meeting.</div>`}
  </div>`;
}
