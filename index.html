<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAS Portfolio Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;--surf:#fff;--surf2:#f0ede6;--surf3:#e8e4dc;
  --bdr:#e2ddd5;--bdr2:#c8c0b4;
  --tx:#1c1814;--tx2:#6b6258;--tx3:#9e9389;
  --grn:#2d6a4f;--grn-bg:#d8f3dc;--grn-lt:#f0faf2;
  --blu:#1a4f8a;--blu-bg:#dbeafe;
  --amb:#92400e;--amb-bg:#fef3c7;
  --red:#991b1b;--red-bg:#fee2e2;
  --pur:#5b21b6;--pur-bg:#ede9fe;
  --acc:#c45c2a;--acc2:#a84d22;
  --r:10px;--rl:16px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.04);
  --sh2:0 8px 32px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;min-height:100vh}

/* ── TOPBAR ── */
.bar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--sh)}
.bar-left{display:flex;align-items:center;gap:14px}
.logo-zone{position:relative;cursor:pointer;flex-shrink:0}
.logo-img{width:42px;height:42px;border-radius:9px;object-fit:cover;border:2px solid var(--bdr);transition:border-color .15s;display:block}
.logo-img:hover{border-color:var(--acc)}
.logo-ph{width:42px;height:42px;border-radius:9px;background:var(--surf2);border:2px dashed var(--bdr2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .15s}
.logo-ph:hover{border-color:var(--acc);background:#fdf0e8}
.logo-file{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.bar-words{line-height:1.2}
.bar-title{font-family:'DM Serif Display',serif;font-size:17px}
.bar-hint{font-size:11px;color:var(--tx3)}
.bar-right{display:flex;align-items:center;gap:10px}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--bdr2)}
.dot.ok{background:var(--grn)}.dot.err{background:var(--red)}.dot.busy{background:var(--amb);animation:pulse .9s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.rtog{display:flex;background:var(--surf2);border-radius:8px;padding:3px;gap:2px}
.rtbtn{padding:5px 14px;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--tx2);transition:all .15s}
.rtbtn.on{background:var(--surf);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ── LAYOUT ── */
.main{max-width:1080px;margin:0 auto;padding:28px 20px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--bdr);background:var(--surf);color:var(--tx);transition:all .15s}
.btn:hover{background:var(--surf2);border-color:var(--bdr2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-p:hover{background:var(--acc2);border-color:var(--acc2)}
.btn-sm{padding:5px 11px;font-size:13px}
.btn-xs{padding:3px 8px;font-size:12px}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:#fca5a5}
.btn-danger:hover{background:#fecaca}
.btn-ghost{border-color:transparent;background:transparent;color:var(--tx2)}
.btn-ghost:hover{background:var(--surf2);color:var(--tx)}

/* ── FORMS ── */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
input[type=text],select,textarea{width:100%;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--tx);background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 13px;outline:none;transition:border-color .15s;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(196,92,42,.1)}
textarea{resize:vertical;min-height:76px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--grn);cursor:pointer}

/* ── TABS ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bdr);margin-bottom:22px}
.tab{padding:9px 16px;font-size:14px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0;font-family:'DM Sans',sans-serif;transition:color .15s}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 18px;box-shadow:var(--sh)}
.sc .sl{font-size:11px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.sc .sv{font-size:26px;font-family:'DM Serif Display',serif}
.sc.hi{background:var(--acc);border-color:var(--acc)}
.sc.hi .sl{color:rgba(255,255,255,.7)}.sc.hi .sv{color:#fff}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.b-single{background:var(--amb-bg);color:var(--amb)}
.b-short{background:var(--grn-bg);color:var(--grn)}
.b-extended{background:var(--blu-bg);color:var(--blu)}
.b-project{background:var(--pur-bg);color:var(--pur)}
.b-c{background:#fce7f3;color:#9d174d}
.b-a{background:var(--amb-bg);color:var(--amb)}
.b-s{background:var(--grn-bg);color:var(--grn)}
.b-met{background:var(--grn-bg);color:var(--grn)}
.b-unmet{background:var(--surf2);color:var(--tx3)}

/* ── EXP CARDS ── */
.exp-list{display:flex;flex-direction:column;gap:12px}
.exp-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);box-shadow:var(--sh);overflow:hidden;transition:box-shadow .15s}
.exp-card:hover{box-shadow:var(--sh2)}
.exp-body{padding:16px 20px}
.exp-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.exp-name{font-size:15px;font-weight:600;font-family:'DM Serif Display',serif;margin-bottom:3px}
.exp-meta{font-size:13px;color:var(--tx3)}
.exp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.exp-summary{font-size:14px;color:var(--tx2);margin-top:9px;line-height:1.6}

/* ── EVIDENCE PANEL ── */
.ev-panel{border-top:1px solid var(--bdr);padding:14px 20px;background:var(--bg)}
.ev-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ev-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2)}
.ev-count{background:var(--surf2);color:var(--tx3);font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.ev-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--surf2);border:1px solid var(--bdr);cursor:pointer;transition:all .15s}
.ev-thumb:hover{box-shadow:var(--sh2);border-color:var(--bdr2)}
.ev-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ev-thumb .ev-overlay{position:absolute;inset:0;background:rgba(28,24,20,0);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s}
.ev-thumb:hover .ev-overlay{background:rgba(28,24,20,.55)}
.ev-thumb .ev-overlay .ev-actions{opacity:0;transition:opacity .15s;display:flex;gap:5px}
.ev-thumb:hover .ev-overlay .ev-actions{opacity:1}
.ev-doc{border-radius:8px;background:var(--surf);border:1px solid var(--bdr);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.ev-doc:hover{box-shadow:var(--sh2);border-color:var(--bdr2)}
.ev-doc-icon{font-size:22px;flex-shrink:0;line-height:1}
.ev-doc-info{flex:1;min-width:0}
.ev-doc-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-doc-meta{font-size:11px;color:var(--tx3)}
.ev-doc-actions{display:flex;gap:4px;flex-shrink:0}
.ev-lo-label{font-size:11px;color:var(--tx3);margin-top:6px;margin-bottom:4px;font-weight:600}

/* Drop zone */
.ev-dropzone{border:2px dashed var(--bdr2);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.ev-dropzone:hover,.ev-dropzone.drag-over{border-color:var(--acc);background:#fdf0e8}
.ev-dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ev-dropzone-icon{font-size:24px;margin-bottom:4px}
.ev-dropzone-text{font-size:13px;color:var(--tx2);font-weight:500}
.ev-dropzone-sub{font-size:12px;color:var(--tx3);margin-top:2px}

/* Upload progress */
.upload-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surf);border:1px solid var(--bdr);border-radius:8px;margin-bottom:6px}
.upload-bar-wrap{flex:1;height:5px;background:var(--bdr);border-radius:3px;overflow:hidden}
.upload-bar{height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.upload-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.upload-pct{font-size:12px;color:var(--tx3);white-space:nowrap}

/* ── LO CARDS ── */
.lo-grid{display:grid;gap:10px}
.lo-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px;box-shadow:var(--sh)}
.lo-card.lo-met{border-color:#6ee7b7;background:var(--grn-lt)}
.lo-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lo-num{width:34px;height:34px;border-radius:7px;background:var(--blu-bg);color:var(--blu);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lo-num.met{background:var(--grn-bg);color:var(--grn)}
.lo-entry{background:var(--surf2);border-radius:7px;padding:10px 12px;margin-top:7px;font-size:13px}
.lo-entry-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lo-file-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:var(--surf);border:1px solid var(--bdr);border-radius:16px;font-size:12px;cursor:pointer;transition:all .15s;text-decoration:none;color:inherit}
.lo-file-chip:hover{border-color:var(--blu);color:var(--blu)}
.lo-file-chip .chip-icon{font-size:13px}

/* ── REQ TABLE ── */
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{text-align:left;padding:9px 13px;background:var(--surf2);font-weight:600;color:var(--tx2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.rt th:first-child{border-radius:7px 0 0 7px}.rt th:last-child{border-radius:0 7px 7px 0}
.rt td{padding:11px 13px;border-bottom:1px solid var(--bdr)}
.rmet{color:var(--grn);font-weight:600}.rno{color:var(--red)}

/* ── STUDENT / CLASS ROWS ── */
.row-list{display:flex;flex-direction:column;gap:7px}
.r-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);cursor:pointer;box-shadow:var(--sh);transition:all .15s}
.r-row:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.r-name{font-weight:600;font-size:15px;font-family:'DM Serif Display',serif}
.r-meta{font-size:13px;color:var(--tx3);margin-top:2px}
.lo-dots{display:flex;gap:3px}
.lo-dot{width:9px;height:9px;border-radius:50%;background:var(--bdr);border:1.5px solid var(--bdr2)}
.lo-dot.on{background:var(--grn);border-color:var(--grn)}

/* ── CLASS HEADER ── */
.cls-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);box-shadow:var(--sh);margin-bottom:8px}
.cls-name{font-family:'DM Serif Display',serif;font-size:18px}

/* ── OVERVIEW TABLE ── */
.ov-wrap{overflow-x:auto}
.ov-table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
.ov-table th{padding:9px 10px;background:var(--surf2);font-weight:600;color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;text-align:left}
.ov-table td{padding:9px 10px;border-bottom:1px solid var(--bdr)}
.ov-table tr.stu-r{cursor:pointer}
.ov-table tr.stu-r:hover td{background:var(--surf2)}
.ov-table tr.cls-r td{background:var(--surf3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);padding:6px 10px}
.ov-y{color:var(--grn);font-weight:700}.ov-n{color:var(--bdr2)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(28,24,20,.52);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto;backdrop-filter:blur(3px)}
.modal{background:var(--surf);border-radius:var(--rl);width:100%;max-width:640px;padding:26px;box-shadow:var(--sh2);border:1px solid var(--bdr)}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bdr)}
.modal-title{font-family:'DM Serif Display',serif;font-size:19px}
.mclose{border:none;background:none;font-size:21px;cursor:pointer;color:var(--tx3);padding:2px 7px;line-height:1}
.mclose:hover{color:var(--tx)}
.msec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.msec::after{content:'';flex:1;height:1px;background:var(--bdr)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding-top:18px;border-top:1px solid var(--bdr);margin-top:18px}
.lo-fi{border:1px solid var(--bdr);border-radius:var(--r);padding:12px;margin-bottom:9px;background:var(--bg)}
.lo-fi-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox-close{position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;line-height:1;opacity:.8}
.lightbox-close:hover{opacity:1}
.lightbox-name{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px;white-space:nowrap}

/* ── PAGE TITLES ── */
.ph{font-family:'DM Serif Display',serif;font-size:24px;letter-spacing:-.01em}
.psub{font-size:13px;color:var(--tx3);margin-top:2px}
.ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.back-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}

/* ── MISC ── */
.empty{text-align:center;padding:56px 20px;color:var(--tx3)}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.6}
.empty-title{font-size:16px;font-weight:600;color:var(--tx2);margin-bottom:5px;font-family:'DM Serif Display',serif}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:20px;box-shadow:var(--sh)}
.spinner{width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
hr{border:none;border-top:1px solid var(--bdr);margin:14px 0}

/* ── LO OVERVIEW GRID (student home) ── */
.lo-overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:28px}
.lo-ov-card{background:var(--surf);border:2px solid var(--bdr);border-radius:var(--rl);padding:16px 18px;cursor:pointer;transition:all .18s;box-shadow:var(--sh);position:relative;overflow:hidden}
.lo-ov-card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.lo-ov-card.is-met{border-color:#16a34a;background:#f0faf2}
.lo-ov-card.not-met{border-color:#dc2626;background:#fff5f5}
.lo-ov-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.lo-ov-label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)}
.lo-ov-pill{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#000;letter-spacing:.03em}
.lo-ov-pill.met{background:#16a34a;color:#000}
.lo-ov-pill.unmet{background:#dc2626;color:#000}
.lo-ov-title{font-family:'DM Serif Display',serif;font-size:15px;margin-bottom:4px;color:var(--tx)}
.lo-ov-desc{font-size:12px;color:var(--tx3);line-height:1.45}
.lo-ov-count{margin-top:10px;font-size:13px;font-weight:600;color:var(--tx2)}
.lo-ov-count span{font-size:20px;font-family:'DM Serif Display',serif;margin-right:4px}
.lo-ov-count span.met-num{color:#16a34a}
.lo-ov-count span.unmet-num{color:#dc2626}
.lo-ov-arrow{position:absolute;right:14px;bottom:14px;font-size:16px;color:var(--bdr2)}
.lo-ov-card:hover .lo-ov-arrow{color:var(--tx2)}

/* ── LO DETAIL SCREEN ── */
.lo-detail-header{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:20px 24px;margin-bottom:18px;box-shadow:var(--sh)}
.lo-detail-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:10px}
.lo-detail-badge.met{background:#16a34a;color:#000}
.lo-detail-badge.unmet{background:#dc2626;color:#000}
.lo-req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.lo-req-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:center}
.lo-req-num{font-size:28px;font-family:'DM Serif Display',serif;color:var(--tx)}
.lo-req-done{font-size:13px;color:var(--tx3);margin-top:2px}
.lo-req-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin-top:6px}
.lo-req-card.req-ok{border-color:#16a34a;background:#f0faf2}
.lo-req-card.req-ok .lo-req-num{color:#16a34a}

/* ── APPROVAL WORKFLOW ── */
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.status-draft{background:var(--surf2);color:var(--tx2);border:1px solid var(--bdr)}
.status-pending{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.status-feedback{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.status-met{background:#d8f3dc;color:#16a34a;border:1px solid #6ee7b7;color:#000}
.approval-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px 20px;box-shadow:var(--sh);margin-bottom:10px;transition:box-shadow .15s}
.approval-card:hover{box-shadow:var(--sh2)}
.approval-card.pending-card{border-left:4px solid #f59e0b}
.approval-card.feedback-card{border-left:4px solid #dc2626}
.approval-card.met-card{border-left:4px solid #16a34a}
.feedback-box{background:#fff5f5;border:1px solid #fca5a5;border-radius:8px;padding:12px 14px;margin-top:10px;font-size:14px;color:var(--tx)}

function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function saveAll(){
  lsSet('cas_v5',{
    students:APP.students,classes:APP.classes,
    experiences:APP.experiences,logoUrl:APP.logoUrl,
    myStudentId:APP.myStudentId
  });
}
function loadAll(){
  const d=lsGet('cas_v5');
  if(d){
    APP.students=d.students||APP.students;
    APP.classes=d.classes||APP.classes;
    APP.experiences=d.experiences||APP.experiences;
    APP.logoUrl=d.logoUrl||null;
    APP.myStudentId=d.myStudentId||APP.myStudentId;
  }
}

function uploadLogo(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{APP.logoUrl=e.target.result;saveAll();renderLogo()};
  r.readAsDataURL(file);
}
function renderLogo(){
  const w=document.getElementById('logoWrap'),h=document.getElementById('logoHint');
  if(APP.logoUrl){
    w.innerHTML=`<img src="${APP.logoUrl}" class="logo-img" alt="Logo">`;
    if(h)h.style.display='none';
  }else{
    w.innerHTML=`<div class="logo-ph">🏫</div>`;
    if(h)h.style.display='';
  }
}

function dot(cls,txt){
  const d=document.getElementById('syncDot'),t=document.getElementById('syncTxt');
  if(d)d.className='dot '+cls;if(t)t.textContent=txt;
}
function setModal(html){
  const o=document.getElementById('modal-overlay');if(o)o.remove();
  if(!html)return;
  const el=document.createElement('div');el.id='modal-overlay';el.className='overlay';
  el.addEventListener('click',ev=>{if(ev.target===el)setModal(null)});
  el.innerHTML=html;document.body.appendChild(el);
}

// ══════════════════════════════════════════════════
function configured(){return SCRIPT_URL&&SCRIPT_URL!=='YOUR_APPS_SCRIPT_URL_HERE'}

async function apiCall(action,extra={}){
  dot('busy','Saving…');
  try{
    const res=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,...extra})});
    const d=await res.json();
    if(d.error){dot('err','Error');throw new Error(d.error)}
    dot('ok','Synced');return d;
  }catch(err){dot('err','Error');throw err}
}

// Read file as base64
function readFileAsBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{
      // Strip the data URL prefix to get raw base64
      const b64=e.target.result.split(',')[1];
      res(b64);
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function handleFileUpload(files, sid, expId, loId){
  if(!configured()){
    alert('Connect to Google Sheets first to upload evidence files.\n\nAdd your Apps Script URL to the SCRIPT_URL constant in this file.');
    return;
  }

  const MAX_MB=50;
  const allowed=['image/','video/','application/pdf',
    'application/msword','application/vnd.openxmlformats',
    'application/vnd.ms-powerpoint','text/plain'];

  for(const file of Array.from(files)){
    // Validate type
    const ok=allowed.some(t=>file.type.startsWith(t));
    if(!ok){showToast(`Skipped "${file.name}" — unsupported file type.`,'err');continue}
    // Validate size
    if(file.size>MAX_MB*1024*1024){showToast(`"${file.name}" exceeds ${MAX_MB}MB limit.`,'err');continue}

    // Register upload in progress tracker
    if(!APP.uploads[expId])APP.uploads[expId]=[];
    const upObj={id:uid(),name:file.name,progress:0,done:false,error:null};
    APP.uploads[expId].push(upObj);
    rerenderEvPanel(sid,expId); // show progress bar immediately

    try{
      // Simulate progress (actual upload is one shot — this gives user feedback)
      const progressInterval=setInterval(()=>{
        if(upObj.progress<85){upObj.progress+=15;rerenderEvPanel(sid,expId)}
      },300);

      const b64=await readFileAsBase64(file);
      const result=await apiCall('uploadFile',{
        studentId:sid,expId,loId:loId||'',
        fileName:file.name,mimeType:file.type,base64Data:b64
      });

      clearInterval(progressInterval);
      upObj.progress=100;upObj.done=true;

      // Add file to local state
      const expArr=APP.experiences[sid]||[];
      const exp=expArr.find(e=>e.id===expId);
      if(exp){
        if(!exp.files)exp.files=[];
        exp.files.push(result.file);
        saveAll();
      }
      showToast(`"${file.name}" uploaded successfully.`,'ok');
    }catch(err){
      upObj.error=err.message;upObj.done=true;
      showToast(`Upload failed: ${err.message}`,'err');
    }

    // Remove from upload queue after short delay
    setTimeout(()=>{
      APP.uploads[expId]=(APP.uploads[expId]||[]).filter(u=>u.id!==upObj.id);
      rerenderEvPanel(sid,expId);
    },2000);
  }
}

async function deleteEvidenceFile(sid, expId, fileId){
  if(!confirm('Delete this evidence file?'))return;
  // Remove from local state
  const exp=(APP.experiences[sid]||[]).find(e=>e.id===expId);
  if(exp&&exp.files)exp.files=exp.files.filter(f=>f.id!==fileId);
  saveAll();
  rerenderEvPanel(sid,expId);
  if(configured()){
    try{await apiCall('deleteFile',{fileId})}
    catch(err){showToast('Delete failed on server: '+err.message,'err')}
  }
}

// ══════════════════════════════════════════════════
function showToast(msg,type='ok'){
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:${type==='ok'?'#2d6a4f':'#991b1b'};color:#fff;padding:10px 20px;
    border-radius:20px;font-size:14px;font-weight:500;z-index:9999;
    box-shadow:0 4px 20px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none`;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function rerenderEvPanel(sid, expId){
  const panelId='ev-panel-'+expId;
  const el=document.getElementById(panelId);
  if(el){el.outerHTML=buildEvPanel(sid,expId)}
  else render(); // fallback full re-render
}

function buildEvPanel(sid, expId, editable=true){
  const files=filesFor(sid,expId);
  const uploads=(APP.uploads[expId]||[]).filter(u=>!u.done);
  const doneUploads=(APP.uploads[expId]||[]).filter(u=>u.done);
  const totalFiles=files.length;

  // Group files by loId ('' = general)
  const grouped={};
  files.forEach(f=>{
    const k=f.loId||'';
    if(!grouped[k])grouped[k]=[];
    grouped[k].push(f);
  });

  const imgFiles=files.filter(f=>isImage(f.mimeType));
  const docFiles=files.filter(f=>!isImage(f.mimeType));

  let html=`<div class="ev-panel" id="ev-panel-${expId}">
    <div class="ev-header">
      <span class="ev-title">Evidence files</span>
      <span class="ev-count">${totalFiles} file${totalFiles!==1?'s':''}</span>
    </div>`;

  // Upload progress bars
  if(uploads.length||doneUploads.length){
    html+=`<div style="margin-bottom:10px">`;
    [...uploads,...doneUploads].forEach(u=>{
      html+=`<div class="upload-item">
        <span style="font-size:18px">${u.error?'❌':u.done?'✅':'⏳'}</span>
        <span class="upload-name">${esc(u.name)}</span>
        <div class="upload-bar-wrap"><div class="upload-bar" style="width:${u.progress}%"></div></div>
        <span class="upload-pct">${u.error?'Failed':u.done?'Done':u.progress+'%'}</span>
      </div>`;
    });
    html+=`</div>`;
  }

  // Image thumbnails
  if(imgFiles.length){
    html+=`<div class="ev-grid">`;
    imgFiles.forEach(f=>{
      const viewUrl=f.driveUrl||'#';
      html+=`<div class="ev-thumb">
        <a href="${esc(viewUrl)}" target="_blank" style="display:block;width:100%;height:100%">
          <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--tx3)">🖼️</div>
        </a>
        <div class="ev-overlay">
          <div class="ev-actions">
            <a href="${esc(viewUrl)}" target="_blank" class="btn btn-sm" style="color:#fff;border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.4)" title="Open in Drive">🔗</a>
            ${editable?`<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteEvidenceFile('${sid}','${expId}','${f.id}')" title="Delete">🗑</button>`:''}
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--tx3);text-align:center;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.fileName)}</div>`;
    });
    html+=`</div>`;
  }

  // Document / video files
  if(docFiles.length){
    html+=`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">`;
    docFiles.forEach(f=>{
      const icon=isVideo(f.mimeType)?'🎬':fileIcon(f.mimeType);
      html+=`<div class="ev-doc">
        <span class="ev-doc-icon">${icon}</span>
        <div class="ev-doc-info">
          <div class="ev-doc-name">${esc(f.fileName)}</div>
          <div class="ev-doc-meta">${f.mimeType||'file'} · ${f.uploadedAt?new Date(f.uploadedAt).toLocaleDateString('en-GB'):''}</div>
        </div>
        <div class="ev-doc-actions">
          <a href="${esc(f.driveUrl||'#')}" target="_blank" class="btn btn-xs" title="Open in Drive">Open ↗</a>
          ${editable?`<button class="btn btn-xs btn-danger" onclick="event.stopPropagation();deleteEvidenceFile('${sid}','${expId}','${f.id}')" title="Delete">🗑</button>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  }

  if(!files.length&&!uploads.length){
    html+=`<div style="font-size:13px;color:var(--tx3);margin-bottom:10px">No evidence files uploaded yet.</div>`;
  }

  // Drop zone (only for editable / student view)
  if(editable){
    html+=`<div class="ev-dropzone" id="dz-${expId}"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="this.classList.remove('drag-over');handleFileUpload(event.dataTransfer.files,'${sid}','${expId}','')">
      <input type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx,.txt"
        onchange="handleFileUpload(this.files,'${sid}','${expId}','')">
      <div class="ev-dropzone-icon">📎</div>
      <div class="ev-dropzone-text">Drop files here or click to browse</div>
      <div class="ev-dropzone-sub">Images, videos, PDFs, Word, PowerPoint · Max 50MB each</div>
    </div>
    ${!configured()?`<div style="font-size:12px;color:var(--amb);margin-top:6px;text-align:center">⚠️ Connect to Google Sheets to enable file uploads — see SETUP.md</div>`:''}`;
  }

  html+=`</div>`;
  return html;
}

  const rows=[
    {label:'Single experiences',       type:'single',  y12:6,y13:4,note:'10 max per 18 months'},
    {label:'Short experiences (8w)',    type:'short',   y12:2,y13:1,note:'2 per 18 months'},
    {label:'Extended experiences (6m)',type:'extended',y12:1,y13:1,note:'1 per 18 months'},

  ];

    <div style="font-family:'DM Serif Display',serif;font-size:16px;margin-bottom:14px">Experience requirements</div>

    <div style="font-family:'DM Serif Display',serif;font-size:16px;margin-bottom:14px">Learning outcome coverage</div>
    ${LOs.map((lo,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bdr)">

    </div>`).join('')}
  </div>`
}

function portfolioStats(sid){
  const list=expsFor(sid);const met=losMet(list);
  const c={single:0,short:0,extended:0,project:0};
  list.forEach(e=>{if(c[e.type]!==undefined)c[e.type]++});
  return{list,met,c};
}

function expStatus(e){return e.status||'draft'}
function loMetApproved(sid){
  const list=expsFor(sid);
  return LOs.map(lo=>list.some(e=>expStatus(e)==='met'&&(e.los||{})[lo.id]&&e.los[lo.id].met));
}
function loMetCount(sid){
  const list=expsFor(sid);
  return LOs.map(lo=>list.filter(e=>expStatus(e)==='met'&&(e.los||{})[lo.id]&&e.los[lo.id].met).length);
}
function allPendingSubmissions(){
  const result=[];
  APP.students.forEach(s=>{
    expsFor(s.id).forEach(e=>{if(expStatus(e)==='pending')result.push({student:s,exp:e})});
  });
  return result;
}
function statusPill(status){
  const map={
    draft:  '<span class="status-pill status-draft">✎ Draft</span>',
    pending:'<span class="status-pill status-pending">⏳ Awaiting approval</span>',
    feedback:'<span class="status-pill status-feedback">↩ Feedback received</span>',
    met:    '<span class="status-pill status-met">✓ Met</span>',
  };
  return map[status]||map.draft;
}

function submitForApproval(sid,expId){
  const exp=(APP.experiences[sid]||[]).find(e=>e.id===expId);
  if(!exp)return;
  exp.status='pending';exp.submittedAt=new Date().toISOString();
  saveAll();render();
  showToast('Submitted for teacher approval.','ok');
  if(configured())apiCall('saveExperience',{exp}).catch(()=>{});
}

        <div style="font-size:26px;font-family:'DM Serif Display',serif;color:#fff">${totalMet}/7</div>
      </div>
    </div>

    <!-- LO overview grid — the only entry point to details -->
    <div style="font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:14px">
      Learning Outcomes <span style="font-size:14px;font-family:'DM Sans',sans-serif;color:var(--tx3);font-weight:400;margin-left:6px">Click any card to view details and manage activities</span>
    </div>

        const met=metApproved[i];
        const count=metCounts[i];
        const hasFeedback=list.some(e=>expStatus(e)==='feedback'&&(e.los||{})[lo.id]);
        const hasPending=list.some(e=>expStatus(e)==='pending'&&(e.los||{})[lo.id]);

          </div>
          <div class="lo-ov-title">${lo.title}</div>
          <div class="lo-ov-desc">${lo.desc}</div>
          <div class="lo-ov-count"><span class="${met?'met-num':'unmet-num'}">${count}</span>approved experience${count!==1?'s':''}</div>
          ${hasFeedback?`<div style="font-size:11px;color:#991b1b;font-weight:600;margin-top:5px">↩ Feedback to review</div>`:''}
          ${hasPending&&!hasFeedback?`<div style="font-size:11px;color:#92400e;font-weight:600;margin-top:5px">⏳ Awaiting approval</div>`:''}
          <div class="lo-ov-arrow">›</div>
        </div>`

    </div>
  </div>`;
}

function openLODetail(loId){APP.studentScreen='lo-detail';APP.currentLoId=loId;APP.loDetailTab='activities';render()}

function renderLODetailScreen(){
  const sid=APP.myStudentId;
  const lo=LOs.find(l=>l.id===APP.currentLoId);
  if(!lo){APP.studentScreen='home';render();return}

  const list=expsFor(sid);
  const metApproved=loMetApproved(sid);
  const loIndex=LOs.indexOf(lo);
  const isMet=metApproved[loIndex];
  const linked=list.filter(e=>(e.los||{})[lo.id]);
  const approvedMet=linked.filter(e=>expStatus(e)==='met'&&e.los[lo.id].met);
  const loDetailTab=APP.loDetailTab||'activities';

  // Requirements: approved-met count by experience type for this LO
  const reqData=Object.entries(ET).filter(([,v])=>v.los.includes(lo.id)).map(([type,v])=>{
    const done=list.filter(e=>e.type===type&&expStatus(e)==='met'&&(e.los||{})[lo.id]&&e.los[lo.id].met).length;
    return{type,label:v.label,done,ok:done>=1};
  });

  // Navigation between LOs
  const loIdx=LOs.indexOf(lo);
  const prevLo=LOs[loIdx-1];
  const nextLo=LOs[loIdx+1];

  document.getElementById('root').innerHTML=`
  <div class="main">
    <!-- Back + LO navigation -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px">
      <button class="btn" onclick="APP.studentScreen='home';APP.currentLoId=null;render()">← Back to Portfolio</button>
      <div style="display:flex;gap:6px">
        ${prevLo?`<button class="btn btn-sm" onclick="openLODetail('${prevLo.id}')">‹ ${prevLo.label}</button>`:'<span></span>'}
        ${nextLo?`<button class="btn btn-sm" onclick="openLODetail('${nextLo.id}')">${nextLo.label} ›</button>`:''}
      </div>
    </div>

    <!-- LO header card -->
    <div class="lo-detail-header" style="margin-bottom:18px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="flex:1">
          <div class="lo-detail-badge ${isMet?'met':'unmet'}" style="margin-bottom:10px">${lo.label} — ${isMet?'MET':'NOT YET MET'}</div>
          <div style="font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:6px">${lo.title}</div>
          <div style="font-size:14px;color:var(--tx2);line-height:1.6">${lo.desc}</div>
          <div style="margin-top:10px;font-size:14px;font-weight:600;color:${isMet?'#16a34a':'#dc2626'}">
            ${isMet?`✓ ${approvedMet.length} approved experience${approvedMet.length!==1?'s address':' addresses'} this outcome`
            :`No approved experiences yet — add an activity below and submit for teacher approval`}
          </div>
        </div>
        <button class="btn btn-p" onclick="openAddExp('${sid}','${lo.id}')">+ Add activity</button>
      </div>

      <!-- Approved count by type -->
      <div class="lo-req-grid" style="margin-top:16px;margin-bottom:0">
        ${reqData.map(r=>`<div class="lo-req-card ${r.ok?'req-ok':''}">
          <div class="lo-req-num">${r.done}</div>
          <div class="lo-req-done">approved</div>
          <div class="lo-req-label">${r.label}</div>
        </div>`).join('')}
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab ${loDetailTab==='activities'?'on':''}" onclick="APP.loDetailTab='activities';render()">
        Activities for ${lo.label} ${linked.length?`(${linked.length})`:''}
      </button>
      <button class="tab ${loDetailTab==='all'?'on':''}" onclick="APP.loDetailTab='all';render()">All experiences</button>
      <button class="tab ${loDetailTab==='requirements'?'on':''}" onclick="APP.loDetailTab='requirements';render()">Requirements</button>
    </div>

    <!-- Tab content -->
    ${loDetailTab==='activities' ? renderLOActivities(sid, lo) : ''}
    ${loDetailTab==='all'        ? renderExpList(sid, true)    : ''}
    ${loDetailTab==='requirements' ? renderReqsView(sid)       : ''}
  </div>`;
}

function renderLOActivities(sid, lo){
  const list=expsFor(sid);
  const linked=list.filter(e=>(e.los||{})[lo.id]);

  if(!linked.length) return`<div class="empty">
    <div class="empty-icon">📝</div>
    <div class="empty-title">No activities linked to ${lo.label} yet</div>
    <div style="margin-bottom:20px">Use "+ Add activity" above to log an experience for this outcome.</div>
  </div>`;

  return`<div style="display:flex;flex-direction:column;gap:12px">
    ${linked.map(e=>{
      const d=e.los[lo.id];
      const status=expStatus(e);
      const files=e.files||[];
      return`<div class="approval-card ${status==='pending'?'pending-card':status==='feedback'?'feedback-card':status==='met'?'met-card':''}">
        <!-- Header row -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
              <span style="font-family:'DM Serif Display',serif;font-size:16px;font-weight:600">${esc(e.name)}</span>
              ${statusPill(status)}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
              <span class="badge ${ET[e.type]?.bc||''}">${ET[e.type]?.label||e.type}</span>
              <span class="badge b-unmet">${esc(e.year||'')}</span>
              ${[e.creativity&&'<span class="badge b-c">Creativity</span>',e.activity&&'<span class="badge b-a">Activity</span>',e.service&&'<span class="badge b-s">Service</span>'].filter(Boolean).join('')}
              ${files.length?`<span class="badge" style="background:var(--blu-bg);color:var(--blu)">📎 ${files.length} file${files.length!==1?'s':''}</span>`:''}
            </div>
            <div style="font-size:13px;color:var(--tx3)">${[e.when,e.where,e.who].filter(Boolean).map(esc).join(' · ')}</div>
          </div>
          <!-- Action buttons -->
          <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:flex-end">
            ${status==='draft'||status==='feedback'?`<button class="btn btn-sm btn-p" onclick="submitForApproval('${sid}','${e.id}')">Submit for approval</button>`:''}
            ${status==='draft'||status==='feedback'?`<button class="btn btn-sm" onclick="openEditExp('${e.id}')">Edit</button>`:''}
            ${status==='draft'||status==='feedback'?`<button class="btn btn-sm btn-danger" onclick="delExp('${sid}','${e.id}')">Delete</button>`:''}
          </div>
        </div>

        <!-- What -->
        ${e.what?`<div style="font-size:14px;color:var(--tx2);margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr);line-height:1.6">${esc(e.what)}</div>`:''}

        <!-- LO reflection for this specific LO -->
        <div style="margin-top:10px;padding:12px;background:${status==='met'?'#f0faf2':status==='feedback'?'#fff5f5':'var(--surf2)'};border-radius:8px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:5px">${lo.label} reflection</div>
          ${d.reflection
            ?`<div style="font-size:14px;color:var(--tx);font-style:italic;line-height:1.6">"${esc(d.reflection)}"</div>`
            :`<div style="font-size:13px;color:var(--tx3)">No reflection written yet. Edit this experience to add one.</div>`}
          ${d.evidence?`<div style="font-size:12px;color:var(--tx3);margin-top:5px">Notes: ${esc(d.evidence)}</div>`:''}
          <div style="margin-top:8px">
            <span class="badge ${d.met?'b-met':'b-unmet'}">${d.met?'✓ LO marked as met':'LO not yet marked as met'}</span>
          </div>
        </div>

        <!-- Evidence files for this experience -->
        ${files.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:8px">Evidence files</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${files.map(f=>`<a href="${esc(f.driveUrl||'#')}" target="_blank" class="lo-file-chip">
              <span class="chip-icon">${fileIcon(f.mimeType)}</span>${esc(f.fileName)}
            </a>`).join('')}
          </div>
        </div>`:''}

        <!-- Teacher feedback -->
        ${status==='feedback'&&e.teacherFeedback?`<div class="feedback-box" style="margin-top:10px"><div class="feedback-label">Teacher feedback</div>${esc(e.teacherFeedback)}</div>`:''}
        ${status==='pending'?`<div style="margin-top:10px;font-size:13px;color:#92400e;background:#fef3c7;padding:8px 12px;border-radius:7px">⏳ Submitted and awaiting teacher review. No action needed.</div>`:''}
        ${status==='met'?`<div style="margin-top:10px;font-size:13px;color:#16a34a;background:#f0faf2;padding:8px 12px;border-radius:7px;font-weight:600">✓ Teacher approved — this experience counts towards ${lo.label}.</div>`:''}

        <!-- Upload evidence (for draft/feedback status) -->
        ${(status==='draft'||status==='feedback')?buildEvPanel(sid,e.id,true):''}
      </div>`
    }).join('')}
  </div>`;
}

function renderApprovalsPanel(){
  const pending=allPendingSubmissions();
  if(!pending.length)return`<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">No pending submissions</div><div>Students will appear here when they submit experiences for approval.</div></div>`;
  return`<div style="display:flex;flex-direction:column;gap:12px">
    ${pending.map(({student,exp})=>{
      const losCovered=Object.entries(exp.los||{}).filter(([,d])=>d.met).map(([k])=>{const lo=LOs.find(l=>l.id===k);return lo?lo.label:k}).join(', ');
      return`<div class="approval-card pending-card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">
              <span style="font-family:'DM Serif Display',serif;font-size:15px;font-weight:600">${esc(exp.name)}</span>
              <span class="teacher-pending-badge">Pending review</span>
              <span class="badge ${ET[exp.type]?.bc||''}">${ET[exp.type]?.label||exp.type}</span>
            </div>
            <div style="font-size:13px;color:var(--tx2);margin-bottom:4px"><strong>Student:</strong> ${esc(student.name)} · ${student.year}</div>
            <div style="font-size:13px;color:var(--tx3)">${[exp.when,exp.where].filter(Boolean).map(esc).join(' · ')}</div>
            ${exp.what?`<div style="font-size:13px;color:var(--tx2);margin-top:6px">${esc(exp.what)}</div>`:''}
            ${losCovered?`<div style="font-size:13px;margin-top:6px"><strong>LOs claimed met:</strong> ${esc(losCovered)}</div>`:''}
            <div style="font-size:12px;color:var(--tx3);margin-top:5px">Submitted: ${exp.submittedAt?new Date(exp.submittedAt).toLocaleDateString('en-GB'):''}</div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0;flex-direction:column">
            <button class="btn btn-sm" style="background:#16a34a;color:#000;border-color:#16a34a" onclick="teacherMarkMet('${student.id}','${exp.id}')">✓ Mark as Met</button>
            <button class="btn btn-sm" onclick="openTeacherFeedback('${student.id}','${exp.id}')">↩ Return with Feedback</button>
          </div>
        </div>
      </div>`
    }).join('')}
  </div>`;
}

function teacherMarkMet(sid,expId){
  const exp=(APP.experiences[sid]||[]).find(e=>e.id===expId);
  if(!exp)return;
  // Mark all LOs in this experience as met
  Object.keys(exp.los||{}).forEach(k=>{exp.los[k].met=true});
  exp.status='met';exp.teacherFeedback='';
  saveAll();render();
  showToast('Experience marked as met.','ok');
  if(configured())apiCall('saveExperience',{exp}).catch(()=>{});
}

function openTeacherFeedback(sid,expId){
  const exp=(APP.experiences[sid]||[]).find(e=>e.id===expId);
  const stu=APP.students.find(s=>s.id===sid);
  if(!exp)return;
  setModal(`<div class="modal">
    <div class="modal-h">
      <div class="modal-title">Return with feedback</div>
      <button class="mclose" onclick="setModal(null)">×</button>
    </div>
    <div style="background:var(--surf2);border-radius:var(--r);padding:12px 14px;margin-bottom:16px">
      <div style="font-weight:600;font-size:14px">${esc(exp.name)}</div>
      <div style="font-size:13px;color:var(--tx3)">${esc(stu?stu.name:sid)}</div>
    </div>
    <div class="fg">
      <label>Feedback for student</label>
      <textarea id="teacherFbText" style="min-height:120px" placeholder="Explain what needs to be improved, what evidence is missing, or what reflections need expanding…">${esc(exp.teacherFeedback||'')}</textarea>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="setModal(null)">Cancel</button>
      <button class="btn btn-p" onclick="submitTeacherFeedback('${sid}','${expId}')">Send feedback</button>
    </div>
  </div>`);
}

function submitTeacherFeedback(sid,expId){
  const fb=document.getElementById('teacherFbText')?.value.trim();
  if(!fb){alert('Please enter some feedback before sending.');return}
  const exp=(APP.experiences[sid]||[]).find(e=>e.id===expId);
  if(!exp)return;
  exp.status='feedback';exp.teacherFeedback=fb;
  saveAll();setModal(null);render();
  showToast('Feedback sent to student.','ok');
  if(configured())apiCall('saveExperience',{exp}).catch(()=>{});
}

function renderTeacherStudent(){
  const stu=APP.students.find(s=>s.id===APP.currentStudentId);
  if(!stu){APP.currentStudentId=null;render();return}
  const cls=APP.classes.find(c=>c.id===APP.currentClassId)||APP.classes.find(c=>c.id===stu.classId);
  const sid=stu.id;const {list,met,c}=portfolioStats(sid);
  const fc=list.reduce((n,e)=>n+(e.files||[]).length,0);
  document.getElementById('root').innerHTML=`
  <div class="main">
    <div class="back-row">

let _editSid=null,_editEid=null,_focusLoId=null;

function openAddExp(sid,focusLoId){_editSid=sid;_editEid=null;_focusLoId=focusLoId||null;buildExpModal()}
function openEditExp(eid){
  _focusLoId=null;
  for(const[sid,exps] of Object.entries(APP.experiences)){
    if(exps.find(e=>e.id===eid)){_editSid=sid;_editEid=eid;break}
  }
  buildExpModal();
}

function buildExpModal(){
  const base=_editEid?(APP.experiences[_editSid]||[]).find(e=>e.id===_editEid):null;
  const expType=(base&&base.type)||'single';
  setModal(`<div class="modal">
    <div class="modal-h">
      <div class="modal-title">${base?'Edit experience':'Add CAS experience'}</div>
      <button class="mclose" onclick="setModal(null)">×</button>
    </div>
    <div style="margin-bottom:16px">
      <div class="msec">Type &amp; year</div>
      <div class="fr">
        <div class="fg"><label>Experience type</label>
          <select id="mType" onchange="rebuildLOForms()">${Object.entries(ET).map(([k,v])=>`<option value="${k}" ${expType===k?'selected':''}>${v.label}</option>`).join('')}</select>
        </div>
        <div class="fg"><label>Academic year</label>
          <select id="mYear">
            <option value="Y12" ${base&&base.year==='Y12'?'selected':''}>Year 12</option>
            <option value="Y13" ${base&&base.year==='Y13'?'selected':''}>Year 13</option>
          </select>
        </div>
      </div>
      <div class="fg"><label>CAS strands</label>
        <div style="display:flex;gap:18px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mC" ${base&&base.creativity?'checked':''}> Creativity</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mA" ${base&&base.activity?'checked':''}> Activity</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mS" ${base&&base.service?'checked':''}> Service</label>
        </div>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <div class="msec">Details</div>
      <div class="fg"><label>Name</label><input type="text" id="mName" value="${esc(base&&base.name||'')}" placeholder="e.g. Weekly football coaching"></div>
      <div class="fg"><label>What — describe the activity</label><textarea id="mWhat" placeholder="What did you do?">${esc(base&&base.what||'')}</textarea></div>
      <div class="fr3">
        <div class="fg"><label>When</label><input type="text" id="mWhen" value="${esc(base&&base.when||'')}" placeholder="Sep–Jan 2025"></div>
        <div class="fg"><label>Where</label><input type="text" id="mWhere" value="${esc(base&&base.where||'')}" placeholder="Location"></div>
        <div class="fg"><label>Who</label><input type="text" id="mWho" value="${esc(base&&base.who||'')}" placeholder="Collaborators"></div>
      </div>
    </div>
    <div>
      <div class="msec">Learning outcomes</div>
      <div id="loForms">${buildLOForms(expType,base)}</div>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="setModal(null)">Cancel</button>
      <button class="btn btn-p" id="saveExpBtn" onclick="saveExp()">Save experience</button>
    </div>
  </div>`);
}

function buildLOForms(expType,base){
  return ET[expType].los.map(loId=>{
    const lo=LOs.find(l=>l.id===loId);
    const d=base?((base.los||{})[loId]||{}):{};
    const highlight=_focusLoId===loId;
    return`<div class="lo-fi" ${highlight?'style="border-color:var(--acc);background:#fdf0e8"':''}>
      ${highlight?`<div style="font-size:12px;color:var(--acc);font-weight:700;margin-bottom:6px">⭐ Focus outcome for this activity</div>`:''}
      <div class="lo-fi-h">
        <div><div style="font-weight:600;font-size:13px">${lo.label}: ${lo.title}</div><div style="font-size:12px;color:var(--tx3)">${lo.desc}</div></div>
        <label style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--grn);cursor:pointer">
          <input type="checkbox" id="lo_met_${loId}" ${(d.met||(highlight&&!base))?'checked':''}> Met
        </label>
      </div>
      <div class="fg" style="margin-bottom:7px"><label>Reflection</label>
        <textarea id="lo_ref_${loId}" style="min-height:60px" placeholder="How did you address this outcome?">${esc(d.reflection||'')}</textarea>
      </div>
      <div class="fg" style="margin-bottom:0"><label>Evidence notes (files can be uploaded after saving)</label>
        <input type="text" id="lo_ev_${loId}" value="${esc(d.evidence||'')}" placeholder="Brief note — e.g. 'see attached photo'">
      </div>
    </div>`
  }).join('')
}

function rebuildLOForms(){
  document.getElementById('loForms').innerHTML=buildLOForms(document.getElementById('mType').value,null);
}

function saveExp(){
  const btn=document.getElementById('saveExpBtn');if(btn)btn.disabled=true;
  const type=document.getElementById('mType').value;
  const los={};
  ET[type].los.forEach(loId=>{
    los[loId]={
      met:document.getElementById('lo_met_'+loId)?.checked||false,
      reflection:document.getElementById('lo_ref_'+loId)?.value.trim()||'',
      evidence:document.getElementById('lo_ev_'+loId)?.value.trim()||'',
    };
  });
  const existing=_editEid?(APP.experiences[_editSid]||[]).find(e=>e.id===_editEid):null;
  const exp={
    id:_editEid||uid(),studentId:_editSid,type,
    year:document.getElementById('mYear').value,
    creativity:document.getElementById('mC').checked,
    activity:document.getElementById('mA').checked,
    service:document.getElementById('mS').checked,
    name:document.getElementById('mName').value.trim(),
    what:document.getElementById('mWhat').value.trim(),
    when:document.getElementById('mWhen').value.trim(),
    where:document.getElementById('mWhere').value.trim(),
    who:document.getElementById('mWho').value.trim(),
    files:existing?existing.files||[]:[], // preserve existing files
    status:existing?existing.status:'draft', // preserve status, new = draft
    submittedAt:existing?existing.submittedAt:'',
    teacherFeedback:existing?existing.teacherFeedback:'',
    los,savedAt:new Date().toISOString(),
  };
  if(!APP.experiences[_editSid])APP.experiences[_editSid]=[];
  const idx=APP.experiences[_editSid].findIndex(e=>e.id===exp.id);
  if(idx>=0)APP.experiences[_editSid][idx]=exp;
  else APP.experiences[_editSid].push(exp);
  saveAll();setModal(null);
  // If was on LO detail screen, go back there
  if(APP.studentScreen==='lo-detail')render();
  else render();
  if(configured())apiCall('saveExperience',{exp}).catch(e=>console.warn(e));
}

function delExp(sid,eid){
  if(!confirm('Delete this experience and all its evidence files?'))return;
  APP.experiences[sid]=(APP.experiences[sid]||[]).filter(e=>e.id!==eid);
  saveAll();render();
  if(configured())apiCall('deleteExperience',{expId:eid}).catch(e=>console.warn(e));
}

function openAddClass(){
  setModal(`<div class="modal" style="max-width:400px">
    <div class="modal-h"><div class="modal-title">New class</div><button class="mclose" onclick="setModal(null)">×</button></div>
    <div class="fg"><label>Class name</label><input type="text" id="clsName" placeholder="e.g. IB Year 12 — Class A"></div>
    <div class="mfoot"><button class="btn" onclick="setModal(null)">Cancel</button><button class="btn btn-p" onclick="saveClass()">Create</button></div>
  </div>`);
  setTimeout(()=>document.getElementById('clsName')?.focus(),50);
}
function saveClass(){
  const name=document.getElementById('clsName')?.value.trim();if(!name)return;
  const id=uid();APP.classes.push({id,name});saveAll();setModal(null);render();
}
function delClass(classId){
  if(!confirm('Delete this class?'))return;
  APP.classes=APP.classes.filter(c=>c.id!==classId);
  APP.students.forEach(s=>{if(s.classId===classId)s.classId=null});
  saveAll();render();
}

function openAddStudentToClass(classId){
  const unassigned=APP.students.filter(s=>s.classId!==classId);
  setModal(`<div class="modal" style="max-width:420px">
    <div class="modal-h"><div class="modal-title">Add student to class</div><button class="mclose" onclick="setModal(null)">×</button></div>
    ${unassigned.length?`
      <div class="fg"><label>Existing student</label>
        <select id="stuSel">${unassigned.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.year})</option>`).join('')}</select>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <button class="btn btn-sm" onclick="addToClass('${classId}')">Add selected</button>
        <span style="font-size:13px;color:var(--tx3)">or</span>
        <button class="btn btn-sm btn-p" onclick="openNewStudent('${classId}')">+ Create new student</button>
      </div>`
    :`<p style="font-size:14px;color:var(--tx2);margin-bottom:14px">All students are already in classes.</p>`}
    <div class="mfoot"><button class="btn" onclick="setModal(null)">Cancel</button>${!unassigned.length?`<button class="btn btn-p" onclick="openNewStudent('${classId}')">+ New student</button>`:''}</div>
  </div>`);
}

function addToClass(classId){
  const sid=document.getElementById('stuSel')?.value;if(!sid)return;
  const s=APP.students.find(x=>x.id===sid);if(s)s.classId=classId;
  saveAll();setModal(null);render();
}

function removeFromClass(sid){
  if(!confirm('Remove student from class?'))return;
  const s=APP.students.find(x=>x.id===sid);if(s)s.classId=null;
  saveAll();render();
}

function openNewStudent(classId){
  setModal(`<div class="modal" style="max-width:400px">
    <div class="modal-h"><div class="modal-title">New student</div><button class="mclose" onclick="setModal(null)">×</button></div>
    <div class="fr">
      <div class="fg"><label>Full name</label><input type="text" id="nStuName" placeholder="e.g. Aisha Patel"></div>
      <div class="fg"><label>Year</label><select id="nStuYear"><option value="Y12">Year 12</option><option value="Y13">Year 13</option></select></div>
    </div>
    <div class="mfoot"><button class="btn" onclick="setModal(null)">Cancel</button><button class="btn btn-p" onclick="saveNewStudent('${classId}')">Add</button></div>
  </div>`);
  setTimeout(()=>document.getElementById('nStuName')?.focus(),50);
}
function saveNewStudent(classId){
  const name=document.getElementById('nStuName')?.value.trim();
  const year=document.getElementById('nStuYear')?.value;
  if(!name)return;
  const stu={id:uid(),name,year,classId};
  APP.students.push(stu);
  APP.experiences[stu.id]=[];
  saveAll();setModal(null);render();
}

function printPDF(sid){
  const stu=APP.students.find(s=>s.id===sid);if(!stu)return;
  const list=expsFor(sid);
  const met=losMet(list);
  const c={single:0,short:0,extended:0,project:0};
  list.forEach(e=>{if(c[e.type]!==undefined)c[e.type]++});
  const today=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  const cls=APP.classes.find(cc=>cc.id===stu.classId);
  const totalFiles=list.reduce((n,e)=>n+(e.files||[]).length,0);
  const logoHtml=APP.logoUrl?`<img src="${APP.logoUrl}" class="pdf-logo" alt="Logo">`:`<div class="pdf-logo-ph">🏫</div>`;

  const expRows=list.map(e=>{
    const t=ET[e.type]||{};
    const strands=[e.creativity&&'C',e.activity&&'A',e.service&&'S'].filter(Boolean).join(', ');
    const metLOs=Object.entries(e.los||{}).filter(([,d])=>d.met).map(([k])=>k.replace('lo','LO')).join(', ');
    const fc=(e.files||[]).length;
    return`<tr>
      <td><strong>${esc(e.name)}</strong><br><span style="color:#9e9389;font-size:8pt">${esc(e.when||'')}${e.where?' · '+esc(e.where):''}</span></td>
      <td><span class="pdf-tb ${t.ptbc||''}">${t.label||e.type}</span></td>
      <td>${esc(e.year||'')}</td>
      <td>${esc(strands)}</td>
      <td>${esc(metLOs)||'—'}</td>
      <td>${fc?`📎 ${fc}`:'—'}</td>
    </tr>`
  }).join('');

  const loItems=LOs.map((lo,i)=>{
    const isMet=met[i];
    const rel=list.filter(e=>(e.los||{})[lo.id]);
    const best=rel.find(e=>e.los[lo.id].met&&e.los[lo.id].reflection)||rel.find(e=>e.los[lo.id].reflection);
    const refl=best?best.los[lo.id].reflection:'';
    const allFiles=rel.flatMap(e=>(e.files||[]));
    return`<div class="pdf-lo-it ${isMet?'m':''}">
      <div class="pdf-lo-hdr">
        <span class="pdf-lo-tag ${isMet?'m':''}">${lo.label}</span>
        <span class="pdf-lo-ttl">${lo.title}</span>
        <span style="margin-left:auto;font-size:9pt;font-weight:600;color:${isMet?'#2d6a4f':'#991b1b'}">${isMet?'✓ Met':'Not yet met'}</span>
      </div>
      ${refl?`<div class="pdf-lo-ref">"${esc(refl)}"</div>`:'<div style="font-size:9pt;color:#9e9389;font-style:italic">No reflection recorded.</div>'}
      ${allFiles.length?`<div class="pdf-lo-files">📎 ${allFiles.length} evidence file${allFiles.length!==1?'s':''} attached in Drive</div>`:''}
    </div>`
  }).join('');

  const reqRows=[
    {label:'Single experiences',       type:'single',  y12:6,y13:4},
    {label:'Short (8 weeks)',           type:'short',   y12:2,y13:1},
    {label:'Extended (6 months)',       type:'extended',y12:1,y13:1},
    {label:'CAS Project',              type:'project', y12:1,y13:0},
  ].map(r=>{
    const y12d=list.filter(e=>e.type===r.type&&e.year==='Y12').length;
    const y13d=list.filter(e=>e.type===r.type&&e.year==='Y13').length;
    const y12ok=y12d>=r.y12,y13ok=y13d>=r.y13||r.y13===0;
    return`<tr>
      <td>${r.label}</td><td>${r.y12}</td>
      <td class="${y12ok?'pdf-rmet':'pdf-rno'}">${y12d} ${y12ok?'✓':'✗'}</td>
      <td>${r.y13||'—'}</td>
      <td class="${r.y13===0?'':y13ok?'pdf-rmet':'pdf-rno'}">${r.y13===0?'—':y13d+' '+(y13ok?'✓':'✗')}</td>
    </tr>`
  }).join('');

  const html=`<div class="pdf-wrap">
    <div class="pdf-hdr">
      ${logoHtml}
      <div class="pdf-hdr-c"><div class="pdf-doc-title">CAS Review Document</div><div class="pdf-doc-sub">IB Creativity, Activity, Service — 2017 Syllabus</div></div>
      <div class="pdf-hdr-r"><div><strong>Date:</strong> ${today}</div><div style="margin-top:4px"><strong>Class:</strong> ${esc(cls?cls.name:'—')}</div></div>

      <div class="pdf-stat"><div class="pdf-stat-l">Single</div><div class="pdf-stat-v">${c.single}</div></div>

    ${list.length?`<table class="pdf-exp-table">

    </div>
    <div class="pdf-foot"><span>CAS Portfolio Tracker · IB CAS 2017</span><span>Generated ${today}</span></div>
  </div>`;

  // Build the full print document as a string
  const printDoc=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>CAS Review \u2014 ${esc(stu.name)}</title>

  // Use Blob URL — works without popup permission and avoids document.write
  try {
    const blob=new Blob([printDoc],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // Revoke after a delay to allow the tab to load
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  } catch(err) {
    // Fallback: inject an iframe overlay inside the page
    showToast('Opening print preview…','ok');
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#fff';
    const closeBtn=document.createElement('button');
    closeBtn.textContent='✕ Close preview';
    closeBtn.style.cssText='position:fixed;top:12px;right:16px;z-index:10000;padding:8px 16px;background:#c45c2a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer';
    closeBtn.onclick=()=>{document.body.removeChild(overlay);document.body.removeChild(closeBtn)};
    const iframe=document.createElement('iframe');
    iframe.style.cssText='width:100%;height:100%;border:none';
    iframe.srcdoc=printDoc;
    overlay.appendChild(iframe);
    document.body.appendChild(overlay);
    document.body.appendChild(closeBtn);
  }
}

function boot(){
  loadAll();renderLogo();render();
  if(configured()){
    dot('busy','Connecting…');
    fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'ping'})})
      .then(r=>r.json())
      .then(()=>dot('ok','Connected'))
      .catch(()=>dot('err','Offline — local data only'));
  }
}

boot();
